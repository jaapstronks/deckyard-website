name: Verify

# Gate on the things that silently rot: formatting, types, and whether the site
# still builds. Runs on PRs and on pushes to main. Deployment is a separate
# workflow (deploy.yml) so a red check here never blocks an already-merged fix,
# but a red check on the PR is the signal to fix it first.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types and Astro templates
        run: npm run check

      - name: Build
        run: npm run build
